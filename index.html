<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101720"><title>아포칼립스에서 살아남기 — 모바일 프로토타입</title><style>
:root{color-scheme:dark;font-family:system-ui,'Noto Sans KR',sans-serif;background:#101720;color:#edf1f6}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(150deg,#111b27,#16191d 60%,#0a1016)}button{font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #344252;background:#101720e8}.brand{font-weight:800;font-size:14px;letter-spacing:.05em}.small{color:#a9bac9;font-size:12px}.toolbar{display:flex;gap:6px;flex-wrap:wrap}.tool{background:#263444;color:#fff;border:1px solid #526477;border-radius:8px;padding:8px 10px;font-size:12px}.stage{position:relative;min-height:245px;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:25px;background:radial-gradient(ellipse at 55% 65%,#56606a55,transparent 50%),linear-gradient(155deg,#243344,#0d161e 75%);overflow:hidden}.stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 69px,#10182135 70px 72px);pointer-events:none}.scene-tag{position:relative;letter-spacing:.12em;color:#d3b985;font-size:12px;font-weight:800}.scene-name{position:relative;font-size:clamp(25px,6vw,39px);font-weight:900;line-height:1.3;text-shadow:0 3px 12px #0008}.stage-note{position:relative;color:#bdc8d3;font-size:13px;margin-top:12px}.panel{background:#101923ef;border-top:1px solid #637082;padding:17px 16px max(22px,env(safe-area-inset-bottom));min-height:330px}.speaker{color:#eacb8d;font-weight:800;font-size:14px;margin-bottom:10px}.dialogue{white-space:pre-line;line-height:1.8;font-size:16px;min-height:90px}.choices{display:grid;gap:9px;margin-top:17px}.choice{background:#223346;border:1px solid #53677c;border-radius:10px;color:#fff;text-align:left;padding:13px 14px;line-height:1.5}.choice:active{background:#39526a}.muted{color:#a9b6c3}.status{display:flex;flex-wrap:wrap;gap:8px;padding:9px 16px;background:#1a2836;border-bottom:1px solid #344252;font-size:12px}.pill{border:1px solid #455a6b;border-radius:30px;padding:4px 8px}.overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.modal{background:#192736;border:1px solid #5d7084;border-radius:16px;padding:22px;width:min(100%,480px);max-height:88dvh;overflow:auto}.modal h2{margin:0 0 10px}.modal p{line-height:1.65}.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.primary{background:#b59a65;color:#0e141b;border:0;border-radius:9px;padding:12px 15px;font-weight:800}.secondary{background:#293a4c;color:#fff;border:1px solid #63758a;border-radius:9px;padding:12px 15px}.notice{border-left:3px solid #c4a878;padding:10px 12px;background:#26313e;margin:12px 0;font-size:13px;line-height:1.6}.menu{padding:24px 18px;display:grid;gap:12px}.menu h1{font-size:clamp(26px,7vw,42px);margin:12px 0}.menu p{color:#b6c4d2;line-height:1.7}.menu button{text-align:left}.hidden{display:none!important}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.end{text-align:center;padding:20px}.end h1{color:#e8cf99}input{accent-color:#c6a66a}</style></head><body><div id="app" class="wrap"></div><script>
'use strict';
const KEY='zombie-vn-prototype-v1',GALLERY='zombie-vn-gallery-v1';
const HEROES=[['HYJ','한유진',28,'간호사','COM-02'],['CSY','차서윤',29,'전직 경찰','COM-03'],['LCR','이채린',25,'전직 산업설비 정비사','COM-05'],['SHR','서하린',27,'전직 감염병 연구기관 데이터 분석가','COM-07'],['JSA','정세아',26,'전직 라디오 진행자','COM-09']];
const TRUE_IDS=HEROES.map(h=>h[0]+'_TRUE');
const SCENES=[
{id:'IT-001',name:'다섯 개의 기록',speaker:'주인공',text:'다섯 개의 결말. 하지만 이건 내가 지금 살아온 다섯 개의 과거가 아니야.\n내가 확인해야 할 건 누군가의 결말이 아니라, 내 기억에 남아 있는 빈자리야.',choices:[['기록의 공통점만 살핀다','galleryMetadataViewed'],['현재 회차의 사실부터 확인한다','currentRunReviewed'],['안전 상태부터 확인한다','safetyReviewed']]},
{id:'IT-002',name:'존재하지 않는 기억',speaker:'주인공',text:'이 부분만 이상해. 사건이 없었던 건지, 내가 기억하지 못하는 건지.\n비어 있다는 사실만으로 누군가가 지웠다고 말할 수는 없어.',choices:[['기억 공백의 시점을 비교한다','memoryGapCompared'],['공백을 가설로 남긴다','memoryGapHypothesis'],['현재 퇴로를 확인한다','retreatChecked']]},
{id:'IT-003',name:'최초의 동의',speaker:'주인공',text:'내가 원해서 시작한 일이었어?\n그때의 내가 누군가를 지키려 했다는 사실과 지금의 내가 모든 결과를 받아들여야 한다는 건 다른 문제야.',choices:[['최초 동의의 범위를 검증한다','initialConsent'],['보호 대상의 신원을 가린다','identityProtected'],['기록의 출처를 조사한다','initialSource']]},
{id:'IT-004',name:'두 번째 서명',speaker:'주인공',text:'처음에 정한 범위를 넘어서는 변경 기록이 있어.\n누가 변경했고 어떤 권한을 근거로 삼았는지 확인해야 해.',choices:[['변경 이력과 권한을 대조한다','extensionAudit'],['추가 동의 자료를 조사한다','extensionConsent'],['확정되지 않은 혐의는 보류한다','extensionHypothesis']]},
{id:'IT-005',name:'서로 다른 진실',speaker:'주인공',text:'유진의 환자 기록, 서윤의 대피 명령, 채린의 설비, 하린의 보고, 세아의 방송….\n서로 다른 사건에는 서로 다른 증거가 필요해. 내 기억의 문제가 그 사람들의 과거까지 설명하는 건 아니야.',choices:[['현재 회차에서 확인된 사실만 채택한다','currentFacts'],['증언의 출처를 보존한다','testimonyAttributed'],['불명확한 연결은 가설로 남긴다','crossCaseHypothesis']]},
{id:'IT-006',name:'봉인의 경계',speaker:'주인공',text:'처음 정한 범위와 이후 기록이 달라. 실제로 무엇이 적용됐는지 확인해야 해.\n내가 내린 선택이 다른 사람에게 모든 선택을 넘겨준다는 뜻은 아니었어.',choices:[['최초 봉인 범위를 대조한다','originalScope'],['확장 적용 사실을 검증한다','extensionApplied'],['기억 회복의 위험을 확인한다','recoveryRisk']]},
{id:'IT-007',name:'지워진 허가',speaker:'주인공',text:'최초 동의는 있었어. 하지만 추가 봉인에 대한 동의는?\n서명이 없다는 것만으로 결론을 내리지 않겠어. 다른 승인 경로가 있었는지도 확인해야 해.',choices:[['동의와 변경 기록을 독립 대조한다','independentCrossCheck'],['추가 승인 주장과 실제 적용을 검증한다','extensionConsentAbsent'],['검증 부족으로 판단을 보류한다','consentDeferred']]},
{id:'IT-008',name:'남겨진 사람들',speaker:'주인공',text:'누가 살아 있는지, 누가 어디에 있는지. 그리고 누가 나와 이야기하기를 원하는지.\n응답이 없다는 건 사망했다는 뜻이 아니야.',choices:[['현재 인물별 위치와 생존을 확인한다','peopleChecked'],['연락에 대한 개별 동의를 구한다','contactConsent'],['접촉하지 않고 개인정보를 보호한다','privacyPreserved']]},
{id:'IT-009',name:'마지막 퇴로',speaker:'주인공',text:'저 문을 지나가면 기록에 접근할 수 있을지도 몰라. 하지만 돌아올 수 있을지는 아직 몰라.\n진실을 찾는다는 이유로 생존을 포기할 필요는 없어.',choices:[['안전한 대체 경로를 확인한다','safeRoute'],['현재 위치에서 재계획한다','replan'],['위험 경로를 검토한다 — 2차 확인 필요','danger']]},
{id:'IT-010',name:'기억의 문',speaker:'주인공',text:'이제 구분할 수 있어. 내가 선택한 봉인과 내가 허락하지 않은 봉인은 다른 일이야.\n하지만 검증되지 않은 사실을 아는 척하며 끝내지는 않겠어.',choices:[['검증된 주장만 최종 기록한다','verifiedTruth'],['부족한 검증은 보류한다','truthPending'],['독립 검증을 다시 수행한다','independentCheck']]},
{id:'IT-011',name:'되찾을 권리',speaker:'주인공',text:'내가 알고 싶은 것과 다른 사람에게 알려도 되는 것은 달라.\n내 기억에 관한 선택은 다시 내가 해야 해.',choices:[['확인된 사실만 제한적으로 공개한다','disclosureLimited'],['보호 정보는 비공개로 보존한다','disclosureProtected'],['기억 회복을 거절하고 사실만 인정한다','recoveryDeclined']]},
{id:'IT-012',name:'봉인 너머의 새벽',speaker:'주인공',text:'모든 질문에 답을 얻지는 못했다. 모든 사람을 구하지도 못했다.\n그때의 내가 누군가를 지키기 위해 내린 선택은 진짜였어. 하지만 그 선택을 이용해 내 기억을 더 빼앗을 권리는 누구에게도 없었어.\n기억하지 못하는 시간이 있어도, 나는 다시 선택할 수 있어.',choices:[['검증된 진실을 받아들이고 새벽을 맞는다','accept'],['부족한 사실을 다시 확인한다','review'],['현재의 안전과 선택을 먼저 지킨다','safety']]}
];
const REQUIRE=['initialConsent','initialSource','extensionAudit','extensionConsent','originalScope','extensionApplied','independentCrossCheck','extensionConsentAbsent'];
const $=s=>document.querySelector(s);let run=null;let gallery=loadGallery();
function loadGallery(){try{return JSON.parse(localStorage.getItem(GALLERY))||{unlockedEndings:[]}}catch{return {unlockedEndings:[]}}}
function saveGallery(){try{localStorage.setItem(GALLERY,JSON.stringify(gallery));return true}catch(e){alert('갤러리 저장 실패: '+e.message);return false}}
function fresh(){return {schemaVersion:1,runId:'run-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),stateVersion:0,mode:'INTEGRATED_TRUE',sceneIndex:0,sceneId:'IT-001',route:{locked:false,heroineId:null,lockEventId:null},protagonist:{hp:100,injuries:[],infectionStage:0,positionId:'INTEGRATED_ARCHIVE',alive:true},characters:Object.fromEntries(HEROES.map(h=>[h[0],{met:false,alive:null,positionId:null,contactConsent:false}])),officialCompanionId:null,patients:{},survivors:{},inventory:{},noise:0,evidence:{},warnings:{},flags:{},completedScenes:{},processedEventIds:{},pendingAction:null,ending:{result:null,completionEventId:null},log:[]}}
function save(){if(!run)return false;try{const next={...run,stateVersion:run.stateVersion+1};localStorage.setItem(KEY,JSON.stringify(next));run.stateVersion=next.stateVersion;return true}catch(e){alert('저장 실패: '+e.message);return false}}
function restore(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.schemaVersion===1&&v.mode==='INTEGRATED_TRUE'&&Number.isInteger(v.sceneIndex)&&v.sceneIndex>=0&&v.sceneIndex<SCENES.length&&v.protagonist&&v.flags&&v.processedEventIds)return v}catch{}return null}
function unlocked(){return TRUE_IDS.every(id=>gallery.unlockedEndings.includes(id))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function button(label,fn,cls='secondary'){const b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=fn;return b}
function modal(title,html,buttons){const d=document.createElement('div');d.className='overlay';const m=document.createElement('div');m.className='modal';m.innerHTML='<h2>'+esc(title)+'</h2>'+html;const a=document.createElement('div');a.className='modal-actions';buttons.forEach(([t,f,c])=>a.append(button(t,()=>{d.remove();f&&f()},c||'secondary')));m.append(a);d.append(m);document.body.append(d)}
function menu(){run=null;$('#app').innerHTML='<div class="top"><span class="brand">APOCALYPSE / VISUAL NOVEL</span><span class="small">375단계 · v0.3</span></div><div class="menu"><div class="small">좀비 비주얼 노벨</div><h1>아포칼립스에서<br>살아남기</h1><p>모바일 실행형 프로토타입. 본편 60장·720장면은 설계 구조만 등록되어 있으며 원본 대본 전체는 아직 탑재되지 않았습니다.</p><div class="notice">통합 트루 12장면을 시험 플레이할 수 있습니다. 핵심 증거의 독립 검증 자료는 미탑재되어 엔딩 판정은 보류됩니다. 일반 해금 조건은 개인 트루 5종 등록이며, 이 빌드에는 엔진 검증용 체험 모드가 별도로 있습니다.</div><div id="menuActions"></div><h3>갤러리</h3><p id="galleryInfo"></p><h3>본편 콘텐츠</h3><p>공통 10장 + 5개 개인 루트 각 10장. 원본 장면 데이터를 가져오기 전까지 본편은 실행되지 않습니다.</p></div>';const a=$('#menuActions');a.style.cssText='display:grid;gap:10px';a.append(button('통합 트루 시작 (정식 해금)',()=>{if(!unlocked())return modal('해금 조건 미충족','<p>다섯 히로인의 개인 트루 엔딩을 모두 등록해야 합니다. 이 프로토타입은 해당 개인 루트의 대본을 아직 탑재하지 않았으므로 정식 해금은 현재 불가능합니다.</p>',[['확인']]);start(false)},'primary'));a.append(button('통합 트루 체험 모드 시작',()=>start(true)));const old=restore();if(old)a.append(button('저장된 회차 이어하기',()=>{run=old;if(run.pendingAction){const pending=run.pendingAction;run.pendingAction=null;if(!save()){run.pendingAction=pending;return}modal('미확정 행동 복구','<p>종료 전에 확인되지 않은 위험 행동은 취소했습니다. 피해나 이동은 적용되지 않았습니다.</p>',[['계속',render]])}else render()}));a.append(button('전체 챕터 ID 목록',showIndex));a.append(button('저장 데이터 JSON 백업',exportBackup));a.append(button('JSON 백업 불러오기',importBackup));a.append(button('엔진 자체 검사',selfTest));$('#galleryInfo').textContent='개인 트루 '+TRUE_IDS.filter(x=>gallery.unlockedEndings.includes(x)).length+'/5 · 통합 트루 '+(gallery.unlockedEndings.includes('INT_TRUE')?'획득':'미획득')+' (체험 모드 획득 불가)'}
function start(demo){run=fresh();run.demo=demo;if(!save())return;render()}
function exportBackup(){const payload={format:'zombie-vn-backup-v2',savedAt:new Date().toISOString(),run:restore(),gallery:loadGallery()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='zombie-vn-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function importBackup(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const f=input.files[0];if(!f)return;if(f.size>2000000)throw Error('파일이 너무 큽니다');const obj=JSON.parse(await f.text());if(obj.format!=='zombie-vn-backup-v2'||!obj.gallery||!Array.isArray(obj.gallery.unlockedEndings))throw Error('지원하지 않는 백업입니다');if(obj.run&&!(obj.run.schemaVersion===1&&obj.run.mode==='INTEGRATED_TRUE'&&Number.isInteger(obj.run.sceneIndex)&&obj.run.sceneIndex>=0&&obj.run.sceneIndex<SCENES.length&&obj.run.protagonist&&obj.run.flags&&obj.run.processedEventIds))throw Error('회차 데이터 형식이 올바르지 않습니다');const beforeRun=localStorage.getItem(KEY),beforeGallery=localStorage.getItem(GALLERY);try{if(obj.run)localStorage.setItem(KEY,JSON.stringify(obj.run));localStorage.setItem(GALLERY,JSON.stringify(obj.gallery))}catch(e){if(beforeRun===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,beforeRun);if(beforeGallery===null)localStorage.removeItem(GALLERY);else localStorage.setItem(GALLERY,beforeGallery);throw e}gallery=loadGallery();menu();modal('복원 완료','<p>JSON 백업을 불러왔습니다. 저장된 회차와 갤러리 정보를 확인하세요.</p>',[['확인']])}catch(e){modal('복원 실패','<p>'+esc(e.message)+'</p>',[['확인']])}};input.click()}
function showIndex(){let ids=[];for(let ch=1;ch<=10;ch++)ids.push('COM-'+String(ch).padStart(2,'0'));for(const h of HEROES)for(let ch=11;ch<=20;ch++)ids.push(h[0]+'-'+ch);modal('본편 60개 챕터 ID','<p>챕터 '+ids.length+'개 / 장면 ID '+ids.length*12+'개 (구조 생성, 대본 미탑재)</p><pre>'+esc(ids.join(' · '))+'</pre>',[['닫기']])}
function render(){if(!run)return menu();if(run.ending.result)return endScreen();const s=SCENES[run.sceneIndex];if(!s)return menu();run.sceneId=s.id;$('#app').innerHTML='<div class="top"><span class="brand">아포칼립스에서 살아남기</span><div class="toolbar"><button class="tool" id="saveBtn">저장</button><button class="tool" id="stateBtn">상태</button><button class="tool" id="menuBtn">메뉴</button></div></div><div class="status"><span class="pill">HP '+run.protagonist.hp+'</span><span class="pill">감염 '+run.protagonist.infectionStage+'/4</span><span class="pill">소음 '+run.noise+'</span><span class="pill">'+(run.demo?'체험 모드':'정식 회차')+'</span></div><div class="stage"><div class="scene-tag">'+esc(s.id)+' · '+(run.sceneIndex+1)+'/12</div><div class="scene-name">'+esc(s.name)+'</div><div class="stage-note">통합 트루 · 봉인 너머의 새벽</div></div><div class="panel"><div class="speaker">'+esc(s.speaker)+'</div><div class="dialogue">'+esc(s.text)+'</div><div id="extra"></div><div class="choices" id="choices"></div></div>';$('#saveBtn').onclick=()=>{if(save())modal('저장 완료','<p>현재 회차가 이 브라우저의 로컬 저장소에 저장되었습니다.</p>',[['확인']])};$('#stateBtn').onclick=stateView;$('#menuBtn').onclick=()=>modal('메뉴로 돌아가기','<p>현재 진행 상태는 자동 저장되어 있습니다.</p>',[['돌아가기'],['메뉴로',menu]]);const cs=$('#choices');s.choices.forEach((c,i)=>cs.append(button(String.fromCharCode(65+i)+'. '+c[0],()=>choose(c[1]),'choice')));if(run.sceneIndex===9&&!coreVerified())$('#extra').innerHTML='<div class="notice">현재 확인된 핵심 검증: '+REQUIRE.filter(x=>run.flags[x]).length+'/'+REQUIRE.length+' · 부족한 증거는 최종 판정에서 보류됩니다.</div>'}
function stateView(){const f=Object.keys(run.flags).filter(k=>run.flags[k]);modal('현재 회차 상태','<p>장면: '+esc(run.sceneId)+'<br>위치: '+esc(run.protagonist.positionId)+'<br>HP: '+run.protagonist.hp+' / 감염: '+run.protagonist.infectionStage+'<br>검증·선택 플래그: '+f.length+'개</p><pre>'+esc(f.join('\n')||'없음')+'</pre>',[['닫기']])}
function applyEvent(id,fn){if(run.processedEventIds[id])return false;fn();run.processedEventIds[id]=true;return true}
function coreVerified(){return REQUIRE.every(k=>run.flags[k]===true)}
function choose(action){if(run.pendingAction)return;if(action==='danger'){run.pendingAction={id:run.runId+':IT-009:danger',kind:'danger',description:'불확실한 통로 진입',possibleDamage:20,retreat:'현재 기록실로 복귀'};if(!save())return;return modal('위험 행동 최종 확인','<p>위험: 불안정한 통로, 예상 피해: HP 20. 퇴로: 현재 기록실. 이 프로토타입의 고정 시험 위험이며 실제 본편 위험 수치는 미확정입니다.</p><div class="notice">취소하면 HP·감염·소음·위치는 변경되지 않습니다.</div>',[['취소',()=>{run.pendingAction=null;save();render()}],['위험을 감수하고 실행',executeDanger,'primary']])}
if(action==='replan'||action==='review'||action==='safety'||action==='truthPending'||action==='consentDeferred'){run.flags[action]=true;save();return modal('판정 보류 · 재계획','<p>아직 다음 장면으로 자동 진행하지 않습니다. 추가 조사 또는 안전한 경로 확보가 필요합니다.</p>',[['계속 조사',render],['현재 장면 재검토',render]])}
if(action==='independentCheck'){run.flags.independentCheckRequested=true;save();return modal('독립 검증 대기','<p>자료를 찾는 선택만으로 모든 사실이 참이 되지 않습니다. 현재 체험판에는 실제 독립 검증 자료가 탑재되지 않아 최종 판정은 보류됩니다.</p>',[['돌아가기',render]])}
if(action==='verifiedTruth'&&!coreVerified())return modal('검증 미완료','<p>핵심 사실이 충분히 검증되지 않았습니다. 독립 검증을 진행하거나 판정을 보류해야 합니다.</p>',[['돌아가기',render]]);
if(action==='accept'){if(!coreVerified()||!run.flags.safeResolution)return modal('통합 트루 판정 보류','<p>핵심 증거 또는 실제 안전 경로가 확인되지 않았습니다. 엔딩을 등록할 수 없습니다.</p>',[['돌아가기',render]]);const id=run.runId+':ending:INT_TRUE';applyEvent(id,()=>{run.flags.finalTruthAcceptance=true;run.flags.autonomyRespected=true;run.ending={result:'INTEGRATED_TRUE',completionEventId:id};run.log.push('통합 트루 완료')});if(!save())return;if(!run.demo){if(!gallery.unlockedEndings.includes('INT_TRUE'))gallery.unlockedEndings.push('INT_TRUE');saveGallery()}return endScreen()}
if(action==='safeRoute'){run.flags.safeResolution=true;run.protagonist.positionId='INTEGRATED_SAFE_ROUTE'}
run.flags[action]=true;run.completedScenes[run.sceneId]=true;run.sceneIndex=Math.min(run.sceneIndex+1,11);run.sceneId=SCENES[run.sceneIndex].id;if(!save())return;render()}
function executeDanger(){if(!run.pendingAction)return render();const a=run.pendingAction;applyEvent(a.id,()=>{run.protagonist.hp=Math.max(0,run.protagonist.hp-a.possibleDamage);run.noise+=2;run.protagonist.positionId='INTEGRATED_RISK_PASSAGE';run.flags.safeResolution=true;run.log.push('위험 통로 진입: HP -20, 소음 +2')});run.pendingAction=null;if(run.protagonist.hp<=0){run.protagonist.alive=false;run.ending.result='DEATH'}else{run.completedScenes[run.sceneId]=true;run.sceneIndex=9;run.sceneId='IT-010'}save();render()}
function endScreen(){const demo=run.demo;$('#app').innerHTML='<div class="top"><span class="brand">아포칼립스에서 살아남기</span></div><div class="stage"><div class="scene-tag">'+(run.ending.result==='DEATH'?'NON-GALLERY DEATH':'INTEGRATED TRUE ENDING')+'</div><div class="scene-name">'+(run.ending.result==='DEATH'?'생존 실패':'봉인 너머의 새벽')+'</div></div><div class="panel end"><h1>'+(run.ending.result==='DEATH'?'생존 실패':'기억은 빼앗길 수 있어도')+'</h1><p>'+(run.ending.result==='DEATH'?'비갤러리 사망 종료':'다시 선택할 권리까지 사라지는 것은 아니다.')+'</p><div class="notice">'+(run.ending.result==='DEATH'?'사망은 갤러리에 등록되지 않습니다.':demo?'체험 모드: 엔딩은 정식 갤러리에 등록되지 않습니다.':'정식 엔딩 완료')+'</div><div id="endActions"></div></div>';$('#endActions').append(button('메뉴로 돌아가기',menu,'primary'))}
function selfTest(){const ids=[];for(let i=1;i<=10;i++)for(let j=1;j<=12;j++)ids.push('COM-'+String(i).padStart(2,'0')+'-S'+String(j).padStart(3,'0'));for(const h of HEROES)for(let i=11;i<=20;i++)for(let j=1;j<=12;j++)ids.push(h[0]+'-'+i+'-S'+String(j).padStart(3,'0'));const checks=[['본편 구조 ID 720개',ids.length===720],['본편 구조 ID 중복 0',new Set(ids).size===720],['통합 장면 12개',SCENES.length===12],['통합 장면 ID 중복 0',new Set(SCENES.map(x=>x.id)).size===12],['장면당 선택지 3개',SCENES.every(x=>x.choices.length===3)],['정식 해금 기본값 차단',!TRUE_IDS.every(x=>[].includes(x))],['새 회차의 감염 단계 0',fresh().protagonist.infectionStage===0],['최종 진실 검증 기본값 거짓',!REQUIRE.every(x=>fresh().flags[x]===true)],['독립 검증 선택만으로 핵심 플래그 불변',!REQUIRE.includes('independentCheckRequested')],['백업 데이터 포맷 정의',typeof exportBackup==='function'&&typeof importBackup==='function']];modal('엔진 자체 검사','<p>'+checks.filter(x=>x[1]).length+'/'+checks.length+'개 통과 (현재 파일에 대한 경량 검사)</p><pre>'+esc(checks.map(x=>(x[1]?'✓ ':'✗ ')+x[0]).join('\n'))+'</pre><div class="notice">이 검사는 원본 720장면 대본, 전체 분기 및 실제 저장 장애를 검증하지 않습니다.</div>',[['닫기']])}
window.addEventListener('error',e=>{console.error(e.error)});menu();
</script></body></html>
